---
# Playbook Ansible : deploiement automatise de Naseej sur Kubernetes (Minikube)
# Usage : cd ansible && ansible-playbook deploy-naseej.yml
- name: Deployer Naseej sur le cluster Kubernetes
  hosts: k8s_cluster
  gather_facts: false

  vars:
    k8s_namespace: naseej
    repo_dir: "{{ playbook_dir }}/.."
    manifest: "{{ repo_dir }}/k8s/naseej-k8s.yaml"
    tag: "1.0"
    images:
      - { name: naseej-auth,      path: backend/auth-service }
      - { name: naseej-emergency, path: backend/emergency-service }
      - { name: naseej-gateway,   path: backend/api-gateway }
      - { name: naseej-frontend,  path: frontend }
    deployments: [auth-service, emergency-service, api-gateway, web-frontend]

  tasks:
    # ---------------------------------------------------------------- 1. prerequis
    - name: Verifier que les noeuds du cluster sont prets
      kubernetes.core.k8s_info:
        kind: Node
      register: nodes

    - name: Controler l'etat Ready de chaque noeud
      ansible.builtin.assert:
        that: >-
          nodes.resources | map(attribute='status.conditions')
          | map('selectattr', 'type', 'equalto', 'Ready') | map('first')
          | map(attribute='status') | unique == ['True']
        success_msg: "{{ nodes.resources | length }} noeud(s) Ready"

    # ---------------------------------------------------------------- 2. images
    - name: Construire les images Docker des microservices
      community.docker.docker_image:
        name: "{{ item.name }}"
        tag: "{{ tag }}"
        source: build
        build:
          path: "{{ repo_dir }}/{{ item.path }}"
      loop: "{{ images }}"
      loop_control:
        label: "{{ item.name }}:{{ tag }}"

    - name: Lister les images deja presentes dans Minikube
      ansible.builtin.command: minikube image ls
      register: minikube_images
      changed_when: false

    - name: Charger dans Minikube les images manquantes
      ansible.builtin.command: "minikube image load {{ item.name }}:{{ tag }}"
      loop: "{{ images }}"
      loop_control:
        label: "{{ item.name }}:{{ tag }}"
      when: (item.name ~ ':' ~ tag) not in minikube_images.stdout

    # ---------------------------------------------------------------- 3. deploiement
    - name: Creer le namespace {{ k8s_namespace }}
      kubernetes.core.k8s:
        api_version: v1
        kind: Namespace
        name: "{{ k8s_namespace }}"
        state: present

    - name: Rechercher le Secret naseej-secret
      kubernetes.core.k8s_info:
        kind: Secret
        namespace: "{{ k8s_namespace }}"
        name: naseej-secret
      register: secret

    - name: Creer le Secret avec des mots de passe aleatoires (seulement s'il n'existe pas)
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata: { name: naseej-secret, namespace: "{{ k8s_namespace }}" }
          type: Opaque
          stringData:
            AUTH_DB_PASSWORD: "{{ lookup('ansible.builtin.password', '/dev/null chars=hexdigits length=32') }}"
            EMERGENCY_DB_PASSWORD: "{{ lookup('ansible.builtin.password', '/dev/null chars=hexdigits length=32') }}"
            JWT_SECRET: "{{ lookup('ansible.builtin.password', '/dev/null chars=hexdigits length=96') }}"
      when: secret.resources | length == 0

    - name: Creer la ConfigMap emergency-init (script d'initialisation PostGIS)
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata: { name: emergency-init, namespace: "{{ k8s_namespace }}" }
          data:
            01-postgis.sql: "{{ lookup('ansible.builtin.file', repo_dir ~ '/infrastructure/postgres/init-postgis.sql') }}"

    - name: Appliquer le manifeste naseej-k8s.yaml
      kubernetes.core.k8s:
        state: present
        apply: true
        src: "{{ manifest }}"

    - name: Attendre que chaque Deployment soit disponible
      kubernetes.core.k8s_info:
        kind: Deployment
        namespace: "{{ k8s_namespace }}"
        name: "{{ item }}"
        wait: true
        wait_condition: { type: Available, status: "True" }
        wait_timeout: 300
      loop: "{{ deployments }}"

    - name: Attendre que les bases de donnees (StatefulSets) soient pretes
      kubernetes.core.k8s_info:
        kind: StatefulSet
        namespace: "{{ k8s_namespace }}"
        name: "{{ item }}"
        wait: true
        wait_timeout: 300
      loop: [auth-db, emergency-db]

    # ---------------------------------------------------------------- 4. verification
    - name: Recuperer les pods du namespace (jusqu'a ce qu'ils soient tous Running)
      kubernetes.core.k8s_info:
        kind: Pod
        namespace: "{{ k8s_namespace }}"
      register: pods
      until: pods.resources | rejectattr('status.phase', 'equalto', 'Running') | list | length == 0
      retries: 30
      delay: 10

    - name: Verifier que tous les pods sont Running
      ansible.builtin.assert:
        that: pods.resources | rejectattr('status.phase', 'equalto', 'Running') | list | length == 0
        success_msg: "{{ pods.resources | length }} pods Running"

    - name: Tester la chaine frontend -> api-gateway -> auth-service
      ansible.builtin.command: >-
        kubectl exec -n {{ k8s_namespace }} deploy/web-frontend --
        wget -qO- http://api-gateway:8080/ready
      register: gateway_ready
      changed_when: false
      failed_when: "'ready' not in gateway_ready.stdout"

    - name: Tester emergency-service et sa base PostGIS
      ansible.builtin.command: >-
        kubectl exec -n {{ k8s_namespace }} deploy/api-gateway --
        wget -qO- http://emergency-service:3000/ready
      register: emergency_ready
      changed_when: false
      failed_when: "'ready' not in emergency_ready.stdout"

    - name: Resume du deploiement
      ansible.builtin.debug:
        msg:
          - "Pods : {{ pods.resources | map(attribute='metadata.name') | join(', ') }}"
          - "api-gateway : {{ gateway_ready.stdout }}"
          - "emergency-service : {{ emergency_ready.stdout }}"
